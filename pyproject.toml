[project]
name = "mc26eval"
version = "0.1.0"
description = "MyoChallenge 2026 participant examples and tutorials"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["myosuite>=3.1"]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "numpy>=1.24", "onnxruntime>=1.20"]
test = [
    "pytest>=7.0",
    "requests>=2.28",
    "numpy>=1.24",
    "onnx>=1.16",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.20",
    "gymnasium>=0.29",
    "torch>=2.0",
    "stable-baselines3>=2.0",
]
mjlab-test = [
    "mc26eval[test]",
    "mjlab-myosuite @ git+https://github.com/MyoHub/mjlab_myosuite.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: hits LIVE_API_BASE (e.g. https://api.mc.myosuite.org)",
]
