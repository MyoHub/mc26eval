[project]
name = "mc26eval"
version = "0.1.0"
description = "MyoChallenge 2026 participant examples and tutorials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
onnx = ["onnx>=1.14", "numpy>=1.24,<2", "onnxruntime>=1.16"]
test = [
    "pytest>=7.0",
    "requests>=2.28",
    "numpy>=1.24,<2",
    "onnx>=1.14",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.16",
    "gymnasium>=0.29",
    "torch>=2.0",
    "stable-baselines3>=2.0",
]
mjlab-test = [
    "mc26eval[test]",
    "mjlab-myosuite @ git+https://github.com/MyoHub/mjlab_myosuite.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: hits LIVE_API_BASE (e.g. https://api.mc.myosuite.org)",
]
